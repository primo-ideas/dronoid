[workspace]
resolver = "3"
members = ["server", "client", "protocol", "logger"]

[workspace.dependencies]
dronoid-logger = { version = "0.1.0", path = "logger" }
dronoid-protocol = { version = "0.1.0", path = "protocol" }

addr = "0.15.6"
anyhow = "1.0.104"
bevy = { version = "0.19.1", default-features = false }
bevy_app = "0.19.1"
bevy_color = "0.19.1"
bevy_ecs = "0.19.1"
bevy_state = "0.19.1"
bson = "3.1.0"
clap = "4.6.7"
colored = "3.1.1"
crossbeam-channel = "0.5.17"
display-info = "0.5.9"
futures = "0.3.34"
getrandom = "0.4.3"
noise = "0.9.0"
rand = "0.10.3"
rapier2d = "0.35.3"
rustls = { version = "0.23.45", default-features = false }
serde = "1.0.229"
thiserror = "2.0.20"
tokio = "1.53.1"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tungstenite = "0.30.0"
validator = "0.21.0"
wasm-bindgen = "0.2.128"
web-sys = "0.3.105"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
