[package]
name = "dronoid"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "dynamic_linking",
] }
bevy_app = "0.20.0"
bevy_ecs = "0.20.0"
bson = { version = "3.1.0", features = ["serde"] }
clap = { version = "4.6.7", features = [
    "derive",
    "std",
    "help",
    "usage",
    "env",
] }
colored = "3.1.1"
crossbeam-channel = { version = "0.5.17", features = ["std"] }
futures = "0.3.34"
noise = "0.9.0"
rand = "0.10.3"
rapier2d = "0.36.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = [
    "time",
    "macros",
    "net",
    "rt",
    "sync",
    "rt-multi-thread",
    "signal",
] }
tokio-tungstenite = { version = "0.30.0", features = ["handshake", "connect"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "registry",
] }
tungstenite = "0.30.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
