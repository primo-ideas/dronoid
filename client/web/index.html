<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dronoid</title>
  <!-- The site has one icon, at its root, which every page under it shares. -->
  <link rel="icon" href="/favicon.png">
  <style>
    /* The game canvas fills the page: the client reads the window size at startup
       (app/web.rs, setup_display) and sizes its window to match. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; outline: none; }
  </style>
</head>
<body>
  <script type="module">
    // The bindings and the module sit beside this page; the textures are under ./assets/,
    // where Bevy's asset server looks for them. deploy/deploy.ps1 puts all three there.
    import init from "./dronoid-client.js";

    init().catch((error) => {
      // winit leaves its event loop by throwing this on purpose: not a failure.
      if (!String(error).includes("Using exceptions for control flow")) {
        throw error;
      }
    });
  </script>
</body>
</html>
